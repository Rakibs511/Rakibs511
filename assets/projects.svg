<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <g filter="url(#blurHeavy)">
    <circle cx="80" cy="440" r="150" fill="url(#glowA)"/>
    <circle cx="1140" cy="40" r="150" fill="url(#glowB)"/>
  </g>

  <rect x="60" y="30" width="1080" height="420" rx="24" fill="#ffffff" fill-opacity="0.045" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="62" y="32" width="1076" height="1" fill="#ffffff" fill-opacity="0.2"/>

  <text x="100" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="url(#headGrad)">FEATURED PROJECTS</text>
  <rect x="100" y="94" width="52" height="3" rx="1.5" fill="url(#headGrad)"/>

  <!-- Card 1: Realtime Chat App -->
  <rect x="100" y="128" width="315" height="290" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="url(#cardBorder1)" stroke-width="1.3"/>
  <text x="124" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">💬 Realtime Chat</text>
  <text x="124" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">Full-featured chat app with instant</text>
  <text x="124" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">messaging, presence &amp; typing indicators,</text>
  <text x="124" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">built for scale.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#22d3ee">
    <rect x="124" y="248" width="66" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="157" y="264" text-anchor="middle">Next.js</text>
    <rect x="196" y="248" width="66" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="229" y="264" text-anchor="middle">NestJS</text>
    <rect x="268" y="248" width="76" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="306" y="264" text-anchor="middle">Socket.io</text>
    <rect x="124" y="278" width="60" height="24" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="154" y="294" text-anchor="middle">Redis</text>
  </g>
  <text x="124" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7dd8ea">github.com/Rakibs511/chat-app &#8594;</text>

  <!-- Card 2: Todo App -->
  <rect x="440" y="128" width="315" height="290" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="url(#cardBorder2)" stroke-width="1.3"/>
  <text x="464" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">✅ Todo App</text>
  <text x="464" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">Modern task manager with drag-and-</text>
  <text x="464" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">drop reordering and persistent</text>
  <text x="464" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">storage.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#c084fc">
    <rect x="464" y="248" width="66" height="24" rx="12" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="497" y="264" text-anchor="middle">Next.js</text>
    <rect x="536" y="248" width="84" height="24" rx="12" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="578" y="264" text-anchor="middle">TypeScript</text>
    <rect x="464" y="278" width="60" height="24" rx="12" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="494" y="294" text-anchor="middle">DnD</text>
  </g>
  <text x="464" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9a3f7">github.com/Rakibs511/TodoApp &#8594;</text>

  <!-- Card 3: Medicare -->
  <rect x="780" y="128" width="315" height="290" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="url(#cardBorder3)" stroke-width="1.3"/>
  <text x="804" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">🛒 Medicare</text>
  <text x="804" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">Full-stack e-commerce platform with</text>
  <text x="804" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">Stripe payments and a complete</text>
  <text x="804" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#aeb8cc">checkout flow.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#f472b6">
    <rect x="804" y="248" width="58" height="24" rx="12" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="833" y="264" text-anchor="middle">React</text>
    <rect x="868" y="248" width="70" height="24" rx="12" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="903" y="264" text-anchor="middle">Express</text>
    <rect x="944" y="248" width="86" height="24" rx="12" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="987" y="264" text-anchor="middle">MongoDB</text>
    <rect x="804" y="278" width="66" height="24" rx="12" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="837" y="294" text-anchor="middle">Stripe</text>
  </g>
  <text x="804" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#f5a8cb">github.com/Rakibs511/medicare &#8594;</text>
</svg>
