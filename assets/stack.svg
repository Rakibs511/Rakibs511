<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#151024"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bgGrad)"/>
  <g filter="url(#blurHeavy)">
    <circle cx="1050" cy="60" r="160" fill="url(#glowA)"/>
    <circle cx="150" cy="520" r="160" fill="url(#glowB)"/>
  </g>

  <rect x="60" y="30" width="1080" height="500" rx="24" fill="#ffffff" fill-opacity="0.045" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="62" y="32" width="1076" height="1" fill="#ffffff" fill-opacity="0.2"/>

  <text x="100" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="url(#headGrad)">TECH STACK</text>
  <rect x="100" y="94" width="52" height="3" rx="1.5" fill="url(#headGrad)"/>

  <!-- Frontend -->
  <text x="100" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9fb0d0" letter-spacing="1">FRONTEND</text>
  <rect x="100" y="152" width="1000" height="68" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <image x="112" y="158" width="976" height="56" href="https://skillicons.dev/icons?i=html,css,js,ts,react,nextjs,tailwind,materialui,framer&amp;theme=dark&amp;perline=9" preserveAspectRatio="xMinYMid meet"/>

  <!-- Backend -->
  <text x="100" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9fb0d0" letter-spacing="1">BACKEND &amp; REALTIME</text>
  <rect x="100" y="260" width="1000" height="68" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <image x="112" y="266" width="700" height="56" href="https://skillicons.dev/icons?i=nodejs,express,nestjs,prisma,graphql,go,py&amp;theme=dark&amp;perline=7" preserveAspectRatio="xMinYMid meet"/>
  <text x="840" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1e0">+ Socket.io &#183; Fiber</text>

  <!-- Data + AI -->
  <text x="100" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9fb0d0" letter-spacing="1">DATA &amp; AI/ML</text>
  <rect x="100" y="368" width="1000" height="68" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <image x="112" y="374" width="450" height="56" href="https://skillicons.dev/icons?i=mongodb,postgresql,mysql,redis,tensorflow,pytorch,sklearn&amp;theme=dark&amp;perline=7" preserveAspectRatio="xMinYMid meet"/>
  <text x="600" y="406" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1e0">+ LangChain &#183; Hugging Face</text>

  <!-- DevOps + Design -->
  <text x="100" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9fb0d0" letter-spacing="1">DEVOPS &#183; DESIGN &#183; VIDEO</text>
  <rect x="100" y="476" width="1000" height="68" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <image x="112" y="482" width="976" height="56" href="https://skillicons.dev/icons?i=git,github,docker,kubernetes,aws,vercel,netlify,jest,cypress,ps,ae&amp;theme=dark&amp;perline=11" preserveAspectRatio="xMinYMid meet"/>
</svg>
