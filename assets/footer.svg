<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150c22"/>
      <stop offset="50%" stop-color="#0e0f1c"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <g filter="url(#blurHeavy)">
    <circle cx="300" cy="60" r="140">
      <animate attributeName="r" values="140;165;140" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="60" r="140" fill="url(#glowA)"/>
    <circle cx="900" cy="200" r="140" fill="url(#glowB)"/>
  </g>

  <rect x="90" y="35" width="1020" height="190" rx="24" fill="#ffffff" fill-opacity="0.045" stroke="url(#borderGrad)" stroke-width="1.3"/>
  <rect x="92" y="37" width="1016" height="1" fill="#ffffff" fill-opacity="0.22"/>

  <text x="600" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="url(#headGrad)">Let&#8217;s Build Something</text>
  <text x="600" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c3cbdd">From full-stack apps to AI-powered products &#8212; always open to new ideas.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="378" y="155" width="150" height="40" rx="20" fill="#0A66C2" fill-opacity="0.18" stroke="#0A66C2" stroke-opacity="0.6"/>
    <text x="453" y="180" text-anchor="middle">LinkedIn ↗</text>
    <rect x="540" y="155" width="150" height="40" rx="20" fill="#1877F2" fill-opacity="0.18" stroke="#1877F2" stroke-opacity="0.6"/>
    <text x="615" y="180" text-anchor="middle">Facebook ↗</text>
    <rect x="702" y="155" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="777" y="180" text-anchor="middle">GitHub ↗</text>
  </g>
</svg>
