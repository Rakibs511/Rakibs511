<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#12101e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="330" fill="url(#bgGrad)"/>
  <g filter="url(#blurHeavy)">
    <circle cx="120" cy="60" r="140" fill="url(#glowA)"/>
    <circle cx="1080" cy="280" r="150" fill="url(#glowB)"/>
  </g>

  <rect x="60" y="30" width="1080" height="270" rx="24" fill="#ffffff" fill-opacity="0.045" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="62" y="32" width="1076" height="1" fill="#ffffff" fill-opacity="0.2"/>

  <text x="100" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="url(#headGrad)">ABOUT ME</text>
  <rect x="100" y="92" width="46" height="3" rx="1.5" fill="url(#headGrad)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#dbe2f0">
    <circle cx="106" cy="132" r="3" fill="#22d3ee"/>
    <text x="122" y="137">Full Stack Engineer building scalable web apps with modern JS ecosystems, cloud-native</text>
    <text x="122" y="159">architecture, and containerized deployments.</text>

    <circle cx="106" cy="188" r="3" fill="#a855f7"/>
    <text x="122" y="193">Founder / engineer at </text>
    <text x="242" y="193" font-weight="700" fill="#ffffff">Ubunzi Studio</text>
    <text x="332" y="193">&#8212; building web/app products and exploring practical,</text>
    <text x="122" y="215">production-ready AI integrations for startups &amp; SaaS teams.</text>

    <circle cx="106" cy="244" r="3" fill="#ec4899"/>
    <text x="122" y="249">Currently experimenting with hybrid AI systems &#8212; lightweight local inference with</text>
    <text x="122" y="271">cloud fallback for heavier workloads.</text>
  </g>
</svg>
